<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400" role="img" aria-labelledby="title desc">
  <title id="title">Hidden Codex Wordmark Logo</title>
  <desc id="desc">Typography-only Hidden Codex wordmark with red hanko seal and transparent background.</desc>

  <!-- HIDDEN -->
  <text x="700" y="505"
        text-anchor="middle"
        fill="#e8e4dc"
        font-family="Cinzel, Trajan Pro, Trajan, 'Times New Roman', serif"
        font-size="62"
        font-weight="400"
        letter-spacing="0.42em">HIDDEN</text>

  <!-- Divider -->
  <g fill="#e8e4dc" stroke="#e8e4dc" stroke-width="3" stroke-linecap="square">
    <line x1="410" y1="585" x2="665" y2="585"/>
    <line x1="735" y1="585" x2="990" y2="585"/>
    <rect x="690" y="575" width="20" height="20" transform="rotate(45 700 585)" stroke="none"/>
  </g>

  <!-- CODEX -->
  <text x="700" y="815"
        text-anchor="middle"
        fill="#e8e4dc"
        font-family="Cormorant Garamond, Trajan Pro, Trajan, 'Times New Roman', serif"
        font-size="220"
        font-weight="400"
        letter-spacing="0.02em">CODEX</text>

  <!-- Hanko seal -->
  <g transform="translate(1198 788)">
    <rect x="0" y="0" width="86" height="86" rx="5" ry="5" fill="none" stroke="#8a1f1f" stroke-width="8"/>
    <text x="43" y="63"
          text-anchor="middle"
          fill="#8a1f1f"
          font-family="'Noto Serif CJK JP', 'Noto Serif JP', 'Yu Mincho', 'Hiragino Mincho ProN', serif"
          font-size="58"
          font-weight="700">秘</text>
  </g>
</svg>
