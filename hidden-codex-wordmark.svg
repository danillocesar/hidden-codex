<svg width="200" height="48" viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Hidden Codex wordmark</title>
  <desc id="desc">Horizontal editorial serif wordmark for Hidden Codex with a subtle cool blue-grey sumi-e brushstroke and a red hanko seal.</desc>

  <!-- Background -->
  <rect width="200" height="48" fill="#0a0b0e"/>

  <!-- Subtle cold sumi-e brushstroke, vector path only -->
  <path
    d="M8.5 22.6
       C20.5 18.6 34.8 18.4 49.2 19.1
       C65.6 19.9 78.7 17.3 95.2 18.5
       C113.8 19.9 127.5 17.6 144.5 18.3
       C160.5 18.9 177.8 17.6 193.2 21.1
       C180.9 22.6 174.1 22.1 162.7 22.8
       C147.5 23.8 131.3 24.8 116.4 24.1
       C98.1 23.2 83.8 26.1 65.5 25.5
       C47.8 24.9 28.4 26.8 8.5 22.6Z"
    fill="#1a1f28"
    opacity="0.78"/>
  <path
    d="M12.2 27.4
       C28.9 28.5 40.8 26.5 56.8 27.2
       C73.4 27.9 89.7 26.8 105.5 27.6
       C125.9 28.7 140.6 26.1 158.9 26.8
       C172.7 27.3 184.3 26.1 192.1 27.6
       C179.3 29.8 164.1 30.1 150.4 29.6
       C132.3 29.1 118.9 30.8 101.3 30.2
       C82.7 29.6 66.4 31.1 49.5 30.3
       C35.7 29.7 22.1 31.2 12.2 27.4Z"
    fill="#1a1f28"
    opacity="0.52"/>
  <path
    d="M18 18.2 C35 17.5 49.7 17.2 65.8 17.9 C47.1 19.2 32.2 19.5 18 18.2Z"
    fill="#1a1f28"
    opacity="0.4"/>
  <path
    d="M139.8 31.7 C155.5 31.1 173.2 31.2 188.4 32.5 C172.1 34.1 154.7 33.7 139.8 31.7Z"
    fill="#1a1f28"
    opacity="0.42"/>

  <!-- Wordmark -->
  <g fill="#e8e4dc">
    <text
      x="29"
      y="28.3"
      font-family="Cinzel, Trajan Pro, 'Times New Roman', serif"
      font-size="8.4"
      font-weight="400"
      letter-spacing="3.35"
      text-anchor="middle">HIDDEN</text>

    <rect x="76.3" y="15.2" width="0.6" height="18.2" fill="#e8e4dc"/>

    <text
      x="122.4"
      y="31.2"
      font-family="Cormorant Garamond, Trajan Pro, Cinzel, 'Times New Roman', serif"
      font-size="22.2"
      font-weight="400"
      letter-spacing="1.15"
      text-anchor="middle">CODEX</text>
  </g>

  <!-- Hanko seal -->
  <g transform="translate(168.2 19.8)">
    <rect x="0" y="0" width="10.6" height="10.6" fill="#8a1f1f"/>
    <rect x="1.15" y="1.15" width="8.3" height="8.3" fill="none" stroke="#e8e4dc" stroke-width="0.45" opacity="0.78"/>
    <text
      x="5.3"
      y="8.25"
      font-family="'Noto Serif CJK JP', 'Yu Mincho', 'Hiragino Mincho ProN', serif"
      font-size="7.2"
      font-weight="500"
      fill="#e8e4dc"
      text-anchor="middle">秘</text>
  </g>
</svg>
